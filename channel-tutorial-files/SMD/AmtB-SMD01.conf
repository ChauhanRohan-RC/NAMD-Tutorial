#############################################################
## JOB DESCRIPTION                                         ##
#############################################################

# SMD on NH3 in AmtB, k=5

#############################################################
## ADJUSTABLE PARAMETERS                                   ##
#############################################################

structure          ../common/AmtB-system.psf
coordinates        ../common/AmtB-system.pdb

set temperature    310
set outputname     AmtB-smd01A

set inputname      ../common/AmtB-equil

binCoordinates $inputname.restart.coor
binVelocities $inputname.restart.vel
extendedSystem $inputname.restart.xsc

proc get_first_ts { xscfile } {
  set fd [open $xscfile r]
  gets $fd
  gets $fd
  gets $fd line
  set ts [lindex $line 0]
  close $fd
  return $ts
}

set firsttime [get_first_ts $inputname.restart.xsc]

firsttimestep 0

#############################################################
## SIMULATION PARAMETERS                                   ##
#############################################################

# Input
paraTypeCharmm	    on
parameters          ../common/par_all27_prot_lipid_cmap.inp
parameters          ../common/toppar_amines.str
#temperature         $temperature


# Force-Field Parameters
exclude             scaled1-4
1-4scaling          1.0
cutoff              12.
switching           on
switchdist          10.
pairlistdist        13.5


# Integrator Parameters
timestep            1.0  ;# 2fs/step (only if needed to finish quickly)
rigidBonds         water  ;# needed for 2fs steps
nonbondedFreq       2
fullElectFrequency  4  
stepspercycle       20


# Constant Temperature Control
langevin            on    ;# do langevin dynamicsgmail.google.com
langevinDamping     1     ;# damping coefficient (gamma) of 5/ps
langevinTemp        $temperature
langevinHydrogen    off    ;# don't couple langevin bath to hydrogens


# Periodic Boundary Conditions
#cellBasisVector1    111.2    0.   0.
#cellBasisVector2     0.   108.9   0.
#cellBasisVector3     0.    0    106.6
#cellOrigin          5.35  5.68   8.92

wrapAll             on


# PME (for full-system periodic electrostatics)
PME                 yes
PMEGridSpacing      1.0

# Constant Pressure Control (variable volume)
useGroupPressure      no ;# needed for rigidBonds
useFlexibleCell       no
useConstantArea       no

langevinPiston        on
langevinPistonTarget  1.01325 ;#  in bar -> 1 atm
langevinPistonPeriod  100.
langevinPistonDecay   50.
langevinPistonTemp    $temperature


# Output
outputName          $outputname

restartfreq         1000     ;# 1000steps = every 1ps
dcdfreq             1000
xstFreq             1000
outputEnergies      100
outputPressure      100


#############################################################
## EXTRA PARAMETERS                                        ##
#############################################################

colvars              on
colvarsConfig        restrain.in

constraints on
consexp 2
consref rest6.ref
conskfile rest6.ref
conskcol O
selectConstraints on
selectConstrX off
selectConstrY off
selectConstrZ on

SMD on
SMDFile smd01.ref
SMDk 5  
SMDVel .00001   ;# 10 A/ns = .01 A/ps = .00001 A/fs
SMDDir 0 0 -1
SMDOutputFreq 100

#############################################################
## EXECUTION SCRIPT                                        ##
#############################################################

# Minimization
#minimize            500
#reinitvels          $temperature

run 5000000 ;#  
