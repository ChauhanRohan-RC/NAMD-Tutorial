#############################################################
## JOB DESCRIPTION                                         ##
#############################################################

# ABF of NH3 in AmtB, window 1	

#############################################################
## ADJUSTABLE PARAMETERS                                   ##
#############################################################

structure          ../../common/AmtB-system.psf
coordinates        win1start.pdb

set temperature    310
set outputname     win1A

extendedSystem ../../common/AmtB-equil.restart.xsc

firsttimestep 0

#############################################################
## SIMULATION PARAMETERS                                   ##
#############################################################

# Input
paraTypeCharmm	    on
parameters          ../../common/par_all27_prot_lipid_cmap.inp
parameters          ../../common/toppar_amines.str
temperature         $temperature


# Force-Field Parameters
exclude             scaled1-4
1-4scaling          1.0
cutoff              12.
switching           on
switchdist          10.
pairlistdist        13.5


# Integrator Parameters
timestep            1.0  ;# 2fs/step (only if needed to finish quickly)
rigidBonds         water  ;# needed for 2fs steps
nonbondedFreq       2
fullElectFrequency  4  
stepspercycle       20


# Constant Temperature Control
langevin            on    ;# do langevin dynamicsgmail.google.com
langevinDamping     1     ;# damping coefficient (gamma) of 5/ps
langevinTemp        $temperature
langevinHydrogen    off    ;# don't couple langevin bath to hydrogens


# Periodic Boundary Conditions
#cellBasisVector1    70.2    0.   0.
#cellBasisVector2     0.   69.3   0.
#cellBasisVector3     0.    0     95.0
#cellOrigin         -8.83 -7.92 -5.34

wrapAll             on


# PME (for full-system periodic electrostatics)
PME                 yes
PMEGridSpacing      1.0

# Constant Pressure Control (variable volume)
useGroupPressure      no ;# needed for rigidBonds
useFlexibleCell       no
useConstantArea       no

langevinPiston        on
langevinPistonTarget  1.01325 ;#  in bar -> 1 atm
langevinPistonPeriod  100.
langevinPistonDecay   50.
langevinPistonTemp    $temperature


# Output
outputName          $outputname

restartfreq         1000     ;# 1000steps = every 1ps
dcdfreq             1000
xstFreq             1000
outputEnergies      100
outputPressure      100


#############################################################
## EXTRA PARAMETERS                                        ##
#############################################################

colvars              on
colvarsConfig        win1.in

#############################################################
## EXECUTION SCRIPT                                        ##
#############################################################

# Minimization
#minimize            500
#reinitvels          $temperature

run 6000000 ;#  
